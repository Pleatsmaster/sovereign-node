# Bounded worker-capability screening (4-stage).
#
# Runs the Qwen2.5-3B-Instruct Q4_K_M candidate through four sequential stages:
# 1. Backend verification (model loads, chat template works)
# 2. v2.3 competence gate (3/3 labels + 12/12 field assignments)
# 3. Report-generation diagnostic (A10 task, structured output)
# 4. Failure-to-correction check (specific correction for documented failure)
#
# This branch is screening apparatus only: main stays frozen; no release files touched.
#
# Trigger: push to screening/capability-gate-v2 starts the run.
#
# Model: Official Qwen/Qwen2.5-3B-Instruct-GGUF, revision-pinned, hash-verified.
# Revision: 7dabda4d13d513e3e842b20f0d435c732f172cbe
# SHA-256: 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d
#
# Verdict posture: job green means the SCREEN COMPLETED. Stage PASS/FAIL is in
# the summary. The admission decision is recomputed locally from returned outputs.

name: qwen-4stage-screening

on:
  push:
    branches: [screening/capability-gate-v2]

defaults:
  run:
    shell: bash

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Record runner environment
        run: |
          echo "ImageVersion=${ImageVersion:-unknown}"
          cat /etc/os-release
          uname -a
          nproc
          free -m

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python3 -m pip install --upgrade "pip==25.0.1"
          python3 -m pip install "llama-cpp-python==0.3.36" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python3 -c "import llama_cpp; print('llama_cpp imported OK')"

      - name: Verify frozen instruments
        run: |
          echo "10ddeeae783ddeca6ff028e89c2b944536beddef7670624bd9d883986c78a848  screening/capability_task_v2_3.py" \
            | sha256sum -c -
          echo "Instruments verified."

      - name: Download candidate model (revision-pinned, hash-verified)
        run: |
          # Pinned to model-repository revision, not mutable resolve/main.
          # Official Qwen model (not bartowski) for stronger provenance.
          curl --fail --show-error --location -o qwen2.5-3b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/7dabda4d13d513e3e842b20f0d435c732f172cbe/qwen2.5-3b-instruct-q4_k_m.gguf"
          echo "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d  qwen2.5-3b-instruct-q4_k_m.gguf" | sha256sum -c -
          ls -lh qwen2.5-3b-instruct-q4_k_m.gguf

      - name: Run 4-stage screening
        id: screen
        timeout-minutes: 100
        run: |
          timeout 5400 python3 screening/worker_screen_v2.py \
            qwen2.5-3b-instruct-q4_k_m.gguf > screening_stdout.log 2> screening_stderr.log
          echo "SCREEN_EXIT=$?" > screen_exit.txt
          cat screening_stdout.log

      - name: Write screening summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          try:
              with open('screening_results.json') as f:
                  results = json.load(f)
              summary = {
                  "status": "COMPLETED",
                  "overall": results.get("overall", False),
                  "stages": {k: v.get("passed") for k, v in results.get("stages", {}).items()},
              }
          except Exception as e:
              summary = {"status": "INFRASTRUCTURE_ERROR", "error": str(e)}
          json.dump(summary, open('screening_summary.json', 'w'), indent=1)
          print(json.dumps(summary, indent=1))
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qwen-4stage-results
          path: |
            screening_stdout.log
            screening_stderr.log
            screening_results.json
            screening_summary.json
            screen_exit.txt
            stage3_output.txt
            stage4_output.txt
          if-no-files-found: error
