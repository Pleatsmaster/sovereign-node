# Qwen2.5-3B 4-stage screening (direct stage execution).
#
# Runs stages directly without orchestration wrapper:
# - Stage 1+2: v2.3 competence gate (proven to work standalone)
# - Stage 3: Report-generation diagnostic
# - Stage 4: Failure-to-correction check
#
# Each stage runs only if the previous passed.

name: qwen-4stage-screening

on:
  push:
    branches: [screening/capability-gate-v2]

defaults:
  run:
    shell: bash

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Record runner environment
        run: |
          echo "ImageVersion=${ImageVersion:-unknown}"
          nproc
          free -m

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python3 -m pip install --upgrade "pip==25.0.1"
          python3 -m pip install "llama-cpp-python==0.3.36" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Verify frozen instruments
        run: |
          echo "10ddeeae783ddeca6ff028e89c2b944536beddef7670624bd9d883986c78a848  screening/capability_task_v2_3.py" | sha256sum -c -

      - name: Download candidate model
        run: |
          curl --fail --location -o model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/7dabda4d13d513e3e842b20f0d435c732f172cbe/qwen2.5-3b-instruct-q4_k_m.gguf"
          echo "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d  model.gguf" | sha256sum -c -
          ls -lh model.gguf

      - name: Stage 2 - v2.3 competence gate
        id: stage2
        timeout-minutes: 50
        run: |
          python3 screening/capability_task_v2_3.py model.gguf > stage2_output.log 2>&1
          echo "exit=$?"
          tail -20 stage2_output.log

      - name: Stage 3 - Report diagnostic
        id: stage3
        if: steps.stage2.outcome == 'success'
        timeout-minutes: 30
        run: |
          python3 screening/stage3_report.py model.gguf 2>&1 | tail -30

      - name: Stage 4 - Correction check
        id: stage4
        if: steps.stage3.outcome == 'success'
        timeout-minutes: 30
        run: |
          python3 screening/stage4_correction.py model.gguf 2>&1 | tail -30

      - name: Write summary
        if: always()
        run: python3 screening/write_summary.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qwen-4stage-results
          path: |
            stage2_output.log
            stage3_output.txt
            stage3_result.json
            stage4_output.txt
            stage4_result.json
            screening_summary.json
          if-no-files-found: warn
