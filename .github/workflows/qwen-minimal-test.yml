# Minimal Qwen screening: v2.3 gate only (diagnostic).
# If this works, the environment is fine and the issue is in worker_screen_v2.py stage 1.
# If this fails, it's an environment/model issue.

name: qwen-gate-minimal-test

on:
  push:
    branches: [screening/capability-gate-v2]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python3 -m pip install --upgrade "pip==25.0.1"
          python3 -m pip install "llama-cpp-python==0.3.36" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Download model
        run: |
          curl --fail --location -o model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/7dabda4d13d513e3e842b20f0d435c732f172cbe/qwen2.5-3b-instruct-q4_k_m.gguf"
          echo "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d  model.gguf" | sha256sum -c -
          ls -lh model.gguf

      - name: Run v2.3 gate directly
        timeout-minutes: 50
        run: |
          python3 screening/capability_task_v2_3.py model.gguf 2>&1 | head -100

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimal-test-output
          path: "*.log"
          if-no-files-found: warn
